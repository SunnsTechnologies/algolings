[workspace]
resolver = "2"
members = [
    "algolings-trace",
    "algolings-cli",
    "exercises/sort",
    "exercises/sort-solutions",
    "exercises/search",
    "exercises/search-solutions",
    "exercises/linked-list",
    "exercises/linked-list-solutions",
    "exercises/stacks-queues",
    "exercises/stacks-queues-solutions",
    "exercises/hash-tables",
    "exercises/hash-tables-solutions",
    "exercises/recursion-backtracking",
    "exercises/recursion-backtracking-solutions",
    "exercises/trees",
    "exercises/trees-solutions",
    "exercises/graphs",
    "exercises/graphs-solutions",
]
# Without this, `cargo run` from the workspace root is ambiguous across the
# binary-producing packages (algolings, exercises-sort-trace,
# sort-solutions-trace, exercises-search-trace, search-solutions-trace) and
# errors out. algolings-cli has exactly one bin,
# so defaulting bare `cargo run`/`cargo build` to it makes the README's
# quickstart (`cargo run`, no flags) actually work as written.
default-members = ["algolings-cli"]

[workspace.package]
license = "MIT"
